<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register as Donor | BloodConnect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo" href="index.html">❤️ BloodConnect</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="register_form.html">Become a Donor</a>
      <a href="emergency.php">Emergency</a>
      <a href="admin.php">Admin</a>
    </nav>
  </header>

  <section class="form-section">
    <h2>Register as a Donor</h2>
    <p class="subtitle">Join our life-saving network of donors and help make a difference.</p>

    <form action="register.php" method="POST" class="form-card">
      <label>Full Name</label>
      <input type="text" name="name" placeholder="Your Name" required>

      <label>Blood Group</label>
      <select name="blood_type" required>
        <option value="">Select Blood Group</option>
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
      </select>

      <label>Availability</label>
      <select name="availability" required>
        <option value="">Select Availability</option>
        <option value="anytime">Can donate anytime</option>
        <option value="urgent_only">Only in urgent cases</option>
        <option value="camps_only">Only in camps/special occasions</option>
      </select>

      <label>Email</label>
      <input type="email" name="email" placeholder="Your Email" required>

      <label>Phone</label>
      <input type="text" name="phone" placeholder="Phone Number" required>

      <button type="submit" class="btn">Submit Registration</button>
    </form>
  </section>

  <footer>
    <p>© 2025 BloodConnect | Made with ❤️ to save lives</p>
  </footer>
</body>
</html>
